<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>food menu</title>
</head>
<body>
    <h1>food menu</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Food name</th>
            <th>Price</th>
            <th>Description</th>
            <th>Action</th>
        </tr>
        {% for i in foods %}
        <tr>
            <td>{{i[0]}}</td>
            <td>{{i[1]}}</td>
            <td>{{i[2]}}</td>
            <td>{{i[3]}}</td>
            <td>{{i[4]}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
